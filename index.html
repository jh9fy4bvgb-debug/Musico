<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cozy Player</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         BACKGROUND AMBIENT
    ================================================== -->

    <div class="background">

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>

    </div>


    <!-- =================================================
         APP PAGES

         [ DISCOVERY ] [ HOME ] [ LYRICS ]
    ================================================== -->

    <div class="app-pages">


        <!-- =================================================
             PAGE 0 — DISCOVERY
        ================================================== -->

        <section class="app-page discovery-page">


            <!-- BACK TO HOME -->

            <button
                class="page-button discovery-back-button"
                onclick="goToHome()"
                aria-label="Torna al player"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M15 18l-6-6 6-6"></path>

                </svg>

            </button>


            <!-- DISCOVERY HEADER -->

            <div class="discovery-header">

                <div class="discovery-label">
                    DISCOVERY
                </div>

                <div class="discovery-selected-source">
                    LA TUA MUSICA
                </div>

                <div class="discovery-selected-artist">
                    —
                </div>

                <div class="discovery-selected-title">
                    Scopri qualcosa
                </div>

            </div>


            <!-- HORIZONTAL CAROUSEL -->

            <div class="discovery-viewport">

                <div class="discovery-track"></div>

                <div class="discovery-message">
                    Accedi con Spotify per scoprire la tua musica.
                </div>

            </div>


            <!-- CONTROLS -->

            <div class="discovery-controls">

                <button
                    class="discovery-arrow"
                    onclick="discoveryPrevious()"
                    aria-label="Precedente"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M15 18l-6-6 6-6"></path>

                    </svg>

                </button>


                <div class="discovery-hint">
                    SCORRI PER ESPLORARE
                </div>


                <button
                    class="discovery-arrow"
                    onclick="discoveryNext()"
                    aria-label="Successivo"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M9 18l6-6-6-6"></path>

                    </svg>

                </button>

            </div>

        </section>



        <!-- =================================================
             PAGE 1 — HOME / PLAYER
        ================================================== -->

        <section class="app-page home-page">


            <!-- DISCOVERY BUTTON -->

            <button
                class="page-button discovery-page-button"
                onclick="goToDiscovery()"
                aria-label="Apri Discovery"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="8"
                    ></circle>

                    <circle
                        cx="12"
                        cy="12"
                        r="2"
                    ></circle>

                    <path d="M14 10l2-2"></path>

                </svg>

            </button>


            <!-- LYRICS BUTTON -->

            <button
                class="page-button lyrics-page-button"
                onclick="goToLyrics()"
                aria-label="Apri lyrics"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <rect
                        x="9"
                        y="3"
                        width="6"
                        height="11"
                        rx="3"
                    ></rect>

                    <path
                        d="M5 11a7 7 0 0 0 14 0"
                    ></path>

                    <path
                        d="M12 18v3"
                    ></path>

                    <path
                        d="M8 21h8"
                    ></path>

                </svg>

            </button>


            <!-- PLAYER -->

            <main class="player">


                <!-- STATUS -->

                <div class="status">

                    <span class="status-dot"></span>

                    <span class="status-text">
                        NON IN RIPRODUZIONE
                    </span>

                </div>


                <!-- COVER -->

                <div class="cover-container">

                    <div class="cover"></div>

                </div>


                <!-- SONG INFO -->

                <section class="song-info">

                    <div class="artist">
                        —
                    </div>

                    <div class="title">
                        Nessuna canzone
                    </div>

                </section>


                <!-- LOGIN -->

                <button
                    class="login-button"
                    onclick="login()"
                >

                    Accedi con Spotify

                </button>


                <!-- PROGRESS -->

                <section class="progress-container">

                    <div class="progress">

                        <div class="progress-bar"></div>

                    </div>


                    <div class="time">

                        <span class="current-time">
                            0:00
                        </span>

                        <span class="total-time">
                            0:00
                        </span>

                    </div>

                </section>

            </main>

        </section>



        <!-- =================================================
             PAGE 2 — LIVE LYRICS
        ================================================== -->

        <section class="app-page lyrics-page">


            <!-- BACK TO HOME -->

            <button
                class="page-button lyrics-back-button"
                onclick="goToHome()"
                aria-label="Torna al player"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M15 18l-6-6 6-6"></path>

                </svg>

            </button>


            <!-- LYRICS HEADER -->

            <div class="lyrics-header">

                <div class="lyrics-label">
                    TESTO
                </div>

                <div class="lyrics-artist">
                    —
                </div>

                <div class="lyrics-title">
                    Nessuna canzone
                </div>

            </div>


            <!-- STYLE SWITCHER -->

            <div
                class="lyrics-style-switcher"
                role="group"
                aria-label="Stile del testo live"
            >

                <button
                    class="lyrics-style-button"
                    type="button"
                    data-lyrics-style="glow"
                    aria-pressed="true"
                >
                    <span aria-hidden="true">✦</span>
                    Glow
                </button>

                <button
                    class="lyrics-style-button"
                    type="button"
                    data-lyrics-style="spatial"
                    aria-pressed="false"
                >
                    <span aria-hidden="true">◈</span>
                    Spaziale
                </button>

                <button
                    class="lyrics-style-button"
                    type="button"
                    data-lyrics-style="vintage"
                    aria-pressed="false"
                >
                    <span aria-hidden="true">▤</span>
                    Vintage
                </button>

                <button
                    class="lyrics-style-button"
                    type="button"
                    data-lyrics-style="graffiti"
                    aria-pressed="false"
                >
                    <span aria-hidden="true">▥</span>
                    Graffiti
                </button>

            </div>


            <!-- LYRICS -->

            <div class="lyrics-container">

                <div
                    class="lyrics"
                    id="lyrics"
                >

                    <div class="lyrics-message">
                        Riproduci una canzone per vedere il testo.
                    </div>

                </div>

            </div>

        </section>


    </div>


    <script src="app.js"></script>

</body>

</html>
